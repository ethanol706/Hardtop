    { cat:"confusing", q:"Good ozone vs Bad ozone — where is each?", a:"Good: <span class='correct'>Stratosphere (15-50 km)</span> — shields UV. Bad: <span class='correct'>Troposphere (ground level)</span> — pollutant, damages lungs and plants (photochemical smog component)." },
    { cat:"exception", q:"All greenhouse gases trap heat — is CO₂ the most potent?", a:"<span class='wrong-ans'>Yes</span> is wrong. <span class='correct'>Methane (CH₄) is 25× more potent</span> than CO₂ as greenhouse gas. N₂O is ~300× more potent. CFCs are ~1000× more. CO₂ is most abundant, not most potent." },
    { cat:"wrong", q:"'Acid rain has pH below 7' — True?", a:"Oversimplification trap. Normal rain is already slightly acidic (pH ≈ 5.6 due to dissolved CO₂). <span class='correct'>Acid rain has pH below 5.6</span>." }
  ]},
  { ch:"15", title:"Solid State", traps:[
    { cat:"confusing", q:"BCC vs FCC — which has higher packing efficiency?", a:"FCC (Face-centred cubic): <span class='correct'>74%</span>. BCC: <span class='correct'>68%</span>. Simple cubic: 52%. FCC = HCP (both 74%). NEET trap: Students think BCC is more efficient." },
    { cat:"exception", q:"All ionic solids are hard and brittle — exception?", a:"Generally true, but not all ionic compounds are hard. <span class='correct'>Silver iodide (AgI) is relatively soft</span>. Also, metals are hard but ductile (not ionic)." },
    { cat:"wrong", q:"'Schottky defect increases density of crystal' — True?", a:"<span class='wrong-ans'>True</span> is wrong. Schottky defect = <span class='correct'>equal cation + anion vacancies → density DECREASES</span>. Frenkel defect: No change in density (ion moves to interstitial, not removed)." },
    { cat:"repeated", q:"Number of atoms per unit cell: SC, BCC, FCC?", a:"SC = <span class='correct'>1</span>. BCC = <span class='correct'>2</span>. FCC = <span class='correct'>4</span>. NaCl unit cell = 4 formula units. Very frequently asked." }
  ]},
  { ch:"16", title:"Solutions", traps:[
    { cat:"confusing", q:"Osmotic pressure vs other colligative properties — which is most sensitive?", a:"<span class='correct'>Osmotic pressure</span> is most sensitive (detects very dilute solutions). Used to measure molar mass of polymers and biological macromolecules." },
    { cat:"exception", q:"van't Hoff factor i > 1 always for electrolytes — exception?", a:"For electrolytes that <span class='correct'>associate in solution</span> (like carboxylic acids in benzene), i < 1. i > 1 for dissociation; i < 1 for association." },
    { cat:"wrong", q:"'Boiling point elevation is directly proportional to molarity' — True?", a:"<span class='wrong-ans'>True</span> is wrong. ΔTb = Kb × <span class='correct'>molality</span> (not molarity). Molality is temperature-independent." },
    { cat:"repeated", q:"Which colligative property is used in reverse osmosis?", a:"<span class='correct'>Osmotic pressure</span>. In RO, pressure greater than osmotic pressure is applied to force solvent through semi-permeable membrane. Used in water purification." }
  ]},
  { ch:"17", title:"Electrochemistry", traps:[
    { cat:"confusing", q:"In electrolytic cell — which is anode, which is cathode?", a:"Electrolytic cell: <span class='correct'>Anode = positive</span> (connected to +ve terminal), oxidation occurs. Cathode = negative, reduction occurs. Opposite sign convention vs galvanic cell!" },
    { cat:"exception", q:"EMF of a cell can be negative — what does that mean?", a:"<span class='correct'>Negative EMF means reaction is non-spontaneous</span> as written. Reverse the reaction for spontaneous direction. ΔG = −nFE; negative E → positive ΔG → non-spontaneous." },
    { cat:"wrong", q:"'Strong electrolytes are fully ionized at all concentrations' — True?", a:"<span class='wrong-ans'>True</span> is wrong. At <span class='correct'>high concentrations, even strong electrolytes show incomplete dissociation</span> due to interionic interactions." },
    { cat:"repeated", q:"At cathode in electrolysis of brine (NaCl solution), what is produced?", a:"<span class='correct'>H₂ gas at cathode</span>. Water is preferentially reduced. At anode: Cl₂ gas. Products: NaOH + Cl₂ + H₂ (chlor-alkali process)." }
  ]},
  { ch:"18", title:"Chemical Kinetics", traps:[
    { cat:"confusing", q:"Order vs Molecularity — can they be fractional?", a:"Order: <span class='correct'>Can be fractional, zero, or negative</span> (experimental). Molecularity: <span class='correct'>Always whole number (1, 2, 3)</span> — theoretically defined. Never fractional or zero." },
    { cat:"exception", q:"Rate constant k changes with concentration — True?", a:"<span class='wrong-ans'>True</span> is wrong. <span class='correct'>k is independent of concentration</span>. k depends only on temperature (Arrhenius equation). This is a fundamental trap." },
    { cat:"wrong", q:"'Zero order reaction rate depends on concentration' — True?", a:"<span class='wrong-ans'>True</span> is wrong. Zero order: <span class='correct'>Rate = k (constant)</span>. Rate is INDEPENDENT of concentration. Half-life = [A]₀/2k (depends on initial concentration — another trap)." },
    { cat:"repeated", q:"Pseudo-first order reaction — example and condition?", a:"<span class='correct'>Acid hydrolysis of ester</span>: RCOOR' + H₂O → RCOOH + R'OH. Water is in excess → effectively constant → 2nd order becomes pseudo-1st order." },
    { cat:"ar", q:"A: Catalyst increases rate of reaction. R: It decreases activation energy.", a:"<span class='correct'>Both A and R true, R correctly explains A.</span> Catalyst provides alternative pathway with lower Ea. Doesn't change ΔG or K." }
  ]},
  { ch:"19", title:"Surface Chemistry", traps:[
    { cat:"confusing", q:"Physisorption vs Chemisorption — which is reversible?", a:"Physisorption: <span class='correct'>Reversible</span>, multilayer, low Ea, decreases with temperature. Chemisorption: <span class='correct'>Irreversible</span>, monolayer, high Ea, initially increases then decreases with T." },
    { cat:"exception", q:"Adsorption always decreases with temperature — True?", a:"<span class='wrong-ans'>True</span> for physisorption only. <span class='correct'>Chemisorption first increases (kinetics) then decreases</span> with temperature — trap." },
    { cat:"wrong", q:"'Lyophilic colloids are less stable than lyophobic' — True?", a:"<span class='wrong-ans'>True</span> is wrong. <span class='correct'>Lyophilic (solvent-loving) colloids are more stable</span>. They don't need stabilizer; solvent interaction provides stability." },
    { cat:"repeated", q:"Hardy-Schulze rule — what determines coagulating power of electrolyte?", a:"<span class='correct'>Higher the charge on the ion opposite to colloidal particle, more effective the coagulation.</span> Al³⁺ > Ca²⁺ > Na⁺ for negative sol. Coagulating value is minimum concentration needed." }
  ]},
  { ch:"23", title:"Coordination Compounds", traps:[
    { cat:"confusing", q:"Spectrochemical series — strong vs weak field?", a:"Weak field (low Δ): <span class='correct'>I⁻ < Br⁻ < Cl⁻ < F⁻ < OH⁻ < H₂O</span>. Strong field (high Δ): <span class='correct'>NH₃ < en < CN⁻ < CO</span>. CO is strongest field ligand." },
    { cat:"exception", q:"All strong field ligands give low-spin complexes — exception?", a:"F⁻ is a weak-field ligand but <span class='correct'>small size</span> sometimes causes unusual behavior. Also, <span class='correct'>d⁰ and d¹⁰</span> configurations have no spin-state distinction — high/low spin not applicable." },
    { cat:"wrong", q:"'EAN rule applies to all coordination compounds' — True?", a:"<span class='wrong-ans'>True</span> is wrong. EAN rule has <span class='correct'>many exceptions</span>. It is a useful guide for organometallic compounds but not universally applicable to simple complexes." },
    { cat:"repeated", q:"IUPAC name of [Co(NH₃)₆]³⁺?", a:"<span class='correct'>Hexaamminecobalt(III) ion</span>. Rule: Ligands alphabetically (a before b...), metal name, oxidation state. Anionic complex ends in '-ate' (e.g. hexacyanoferrate(II))." }
  ]},
  { ch:"24", title:"Haloalkanes and Haloarenes", traps:[
    { cat:"confusing", q:"SN1 vs SN2 — which substrate favors which?", a:"SN2: <span class='correct'>Primary substrates</span> (less steric hindrance, backside attack). SN1: <span class='correct'>Tertiary substrates</span> (stable carbocation). Secondary: both possible." },
    { cat:"exception", q:"SN2 always gives complete inversion — exception?", a:"<span class='correct'>No exception for pure SN2</span> — always complete inversion (Walden inversion). If racemization occurs, it means SN1 is operating." },
    { cat:"wrong", q:"'Vinyl halides undergo SN2 easily' — True?", a:"<span class='wrong-ans'>True</span> is wrong. Vinyl halides and aryl halides are <span class='correct'>very resistant to nucleophilic substitution</span> due to resonance strengthening of C-X bond and sp² carbon." },
    { cat:"repeated", q:"Which halide reacts fastest in SN2: RF, RCl, RBr, RI?", a:"<span class='correct'>RI > RBr > RCl > RF</span>. Larger halogen = weaker C-X bond = better leaving group. Opposite for SN2 rate with different nucleophiles." }
  ]},
  { ch:"25", title:"Alcohols, Phenols and Ethers", traps:[
    { cat:"confusing", q:"Alcohols vs Phenols — which is more acidic?", a:"<span class='correct'>Phenol is more acidic</span> than alcohol. Phenoxide ion is stabilized by resonance (delocalization into ring). Water is more acidic than alcohol but less acidic than phenol." },
    { cat:"exception", q:"Dehydration of alcohol always gives alkene at 443K — exception?", a:"Primary alcohol at moderate temp gives <span class='correct'>ether first</span> (413K, intermolecular). Higher temperature (443K) gives alkene (intramolecular). Trap: Assuming 443K always gives alkene for all alcohols." },
    { cat:"wrong", q:"'Ethers are completely unreactive' — True?", a:"<span class='wrong-ans'>True</span> is wrong. Ethers are cleaved by <span class='correct'>HI (strongest acid, best nucleophile)</span>: ROC + HI → RI + ROH. Resistant to most reagents, but not all." },
    { cat:"ar", q:"A: Phenol turns pink on exposure to air. R: It gets oxidized to form coloured quinoid compounds.", a:"<span class='correct'>Both A and R true, R correctly explains A.</span> This is why phenol must be stored away from light/air." }
  ]},
  { ch:"26", title:"Aldehydes, Ketones and Carboxylic Acids", traps:[
    { cat:"confusing", q:"Aldehydes give Fehling's test positive but ketones do not — exception?", a:"<span class='correct'>Exception: HCHO (formaldehyde) also gives Fehling's positive</span>. More relevantly: <span class='correct'>Benzaldehyde does NOT give Fehling's positive</span> (aromatic aldehyde fails this test)." },
    { cat:"wrong", q:"'Iodoform test is positive for all ketones' — True?", a:"<span class='wrong-ans'>True</span> is wrong. Iodoform test is positive only for <span class='correct'>methyl ketones (CH₃CO−)</span> and compounds oxidizable to methyl ketone (ethanol, secondary alcohols with CH₃CHOH group)." },
    { cat:"repeated", q:"What is the product of Cannizzaro reaction?", a:"Aldehydes WITHOUT α-H (like HCHO, PhCHO) undergo Cannizzaro in NaOH: one molecule oxidized to <span class='correct'>carboxylate (acid)</span>, one reduced to <span class='correct'>alcohol</span>. Cross-Cannizzaro between HCHO and another aldehyde also possible." },
    { cat:"exception", q:"Carboxylic acids are stronger than phenols — exception?", a:"Generally true. But some <span class='correct'>heavily electron-withdrawing substituted phenols</span> (picric acid = 2,4,6-trinitrophenol) are as strong as carboxylic acids." },
    { cat:"ar", q:"A: Formaldehyde does not undergo aldol condensation. R: It lacks α-hydrogen atoms.", a:"<span class='correct'>Both A and R true, R correctly explains A.</span> Aldol condensation requires α-H. HCHO has no α-C at all." }
  ]},
  { ch:"27", title:"Amines", traps:[
    { cat:"confusing", q:"Basicity of amines in water: 2° > 1° > 3° — why does 3° come last?", a:"In water, <span class='correct'>3° amines have no N-H bonds → cannot form H-bonds with water → poor solvation of cation</span>. Less solvation = less stabilized conjugate acid = lower basicity." },
    { cat:"exception", q:"Aniline is weaker base than ammonia — why?", a:"Lone pair of N in aniline is <span class='correct'>delocalized into benzene ring</span> (resonance) → less available for protonation → less basic. Substituents change basicity: p-NO₂ aniline < aniline < p-CH₃ aniline." },
    { cat:"wrong", q:"'Carbylamine reaction is given by all amines' — True?", a:"<span class='wrong-ans'>True</span> is wrong. Carbylamine (isocyanide) reaction is given <span class='correct'>only by primary amines (both aliphatic and aromatic)</span>. 2° and 3° amines do not give this." },
    { cat:"repeated", q:"Diazonium salt formation — what are the conditions?", a:"<span class='correct'>Primary aromatic amine + NaNO₂ + HCl + 0–5°C</span>. Temperature must be maintained low to prevent decomposition. Aliphatic diazonium salts are unstable; only aryl diazonium salts are stable enough to use." }
  ]},
  { ch:"28", title:"Biomolecules", traps:[
    { cat:"confusing", q:"Reducing vs Non-reducing sugars — how to identify?", a:"Reducing: Have free <span class='correct'>aldehyde or ketone group</span>; give Fehling's/Tollens' positive. Non-reducing: No free carbonyl; e.g. <span class='correct'>sucrose (C1-C2 glycosidic bond locks both anomeric carbons)</span>." },
    { cat:"exception", q:"All disaccharides are reducing sugars — exception?", a:"<span class='correct'>Sucrose is non-reducing</span>. Lactose and maltose are reducing. Trehalose is also non-reducing. The anomeric carbon must be free for reducing action." },
    { cat:"wrong", q:"'Denaturation of protein destroys its primary structure' — True?", a:"<span class='wrong-ans'>True</span> is wrong. Denaturation disrupts <span class='correct'>secondary, tertiary, quaternary structures</span>. Primary structure (peptide bonds) remains intact." },
    { cat:"repeated", q:"What type of bond connects nucleotides in DNA?", a:"<span class='correct'>3',5'-phosphodiester bond</span>. Between 3'-OH of one deoxyribose and 5'-phosphate of next. Complementary strands held by H-bonds (A=T: 2 H-bonds; G≡C: 3 H-bonds)." }
  ]},
  { ch:"09", title:"Hydrogen and its Compounds", traps:[
    { cat:"exception", q:"H₂O₂ is only an oxidizing agent — True?", a:"<span class='wrong-ans'>True</span> is wrong. H₂O₂ is both oxidizing AND <span class='correct'>reducing agent</span>. Reducing: H₂O₂ + 2KMnO₄ + H₂SO₄ → K₂SO₄ + 2MnSO₄ + 2H₂O + O₂. Oxidizing: towards I⁻, Fe²⁺ etc." },
    { cat:"confusing", q:"Volume strength of H₂O₂ — what does '10 volume' mean?", a:"10 volume H₂O₂: <span class='correct'>1 L of this solution gives 10 L of O₂ at STP</span>. Normality = Volume strength / 5.6. Molarity = Volume strength / 11.2." },
    { cat:"wrong", q:"'Heavy water (D₂O) retards nuclear reactions' — True?", a:"<span class='wrong-ans'>True</span> is wrong. D₂O is used as a <span class='correct'>moderator to SLOW DOWN (not retard) neutrons</span> so they can cause more fission in nuclear reactors." }
  ]}
]
};

let currentTab = 'bio';
let currentCat = 'all';

function countTraps(){
  let bio=0, phy=0, chem=0;
  TRAPS.bio.forEach(ch => bio += ch.traps.length);
  TRAPS.phy.forEach(ch => phy += ch.traps.length);
  TRAPS.chem.forEach(ch => chem += ch.traps.length);
  document.getElementById('bio-count').textContent = bio;
  document.getElementById('phy-count').textContent = phy;
  document.getElementById('chem-count').textContent = chem;
}

function switchTab(tab, btn){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.className='tab');
  btn.classList.add('active-'+tab);
  document.getElementById('searchInput').value='';
  render();
}

function setCat(cat, btn){
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => {
    const cls = b.className.split(' ').filter(c => c==='cat-btn').join(' ');
    b.className = 'cat-btn';
  });
  btn.className = 'cat-btn on-'+cat;
  render();
}

function render(){
  const list = document.getElementById('trapList');
  const query = document.getElementById('searchInput').value.toLowerCase();
  const data = TRAPS[currentTab];
  let html = '';

  data.forEach((chapter, ci) => {
    let filtered = chapter.traps.filter(t => {
      if(currentCat !== 'all' && t.cat !== currentCat) return false;
      if(query){
        const text = (chapter.title + ' ' + t.q + ' ' + t.a).toLowerCase();
        if(!text.includes(query)) return false;
      }
      return true;
    });

    if(filtered.length === 0) return;

    const id = 'ch_'+currentTab+'_'+ci;
    html += `
    <div class="ch-card" id="${id}">
      <div class="ch-header" onclick="toggleCh('${id}')">
        <span class="ch-num ${currentTab}-num">Ch ${chapter.ch}</span>
        <div class="ch-meta">
          <div class="ch-title">${chapter.title}</div>
          <div class="ch-count">${filtered.length} trap${filtered.length>1?'s':''}</div>
        </div>
        <span class="expand-icon">▼</span>
      </div>
      <div class="ch-body">
        <div class="ch-content">
          ${filtered.map(t => `
          <div class="trap-item ${t.cat}">
            <span class="trap-tag tag-${t.cat}">${tagLabel(t.cat)}</span>
            <div class="trap-q">${t.q}</div>
            <div class="trap-a">${t.a}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  });

  if(!html) html = '<div class="empty">No traps found for this filter 🔍</div>';
  list.innerHTML = html;
}

function tagLabel(cat){
  const m = {exception:'⚠️ EXCEPTION', wrong:'❌ WRONG STMT', confusing:'😵 CONFUSING', ar:'🔗 A/R TRAP', repeated:'🔁 REPEATED'};
  return m[cat] || cat.toUpperCase();
}

function toggleCh(id){
  const el = document.getElementById(id);
  el.classList.toggle('open');
  el.classList.toggle('has-open', el.classList.contains('open'));
}

countTraps();
render();
</script>

</html>
